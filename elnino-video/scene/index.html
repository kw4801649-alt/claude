function integral(f) {

function globeTexture() {

  const g = c.getContext("2d");

  g.fillStyle = "#1f5fa8"; g.fillRect(0, 0, tw, th);
  // El Niño warm anomaly in the equatorial central/eastern Pacific
  g.save(); g.translate(u(-125), v(-1)); g.scale(1, 0.16);
  const grd = g.createRadialGradient(0, 0, 0, 0, 0, u(-75) - u(-125));
  grd.addColorStop(0, "rgba(240,110,50,0.95)"); grd.addColorStop(0.6, "rgba(246,162,74,0.65)"); grd.addColorStop(1, "rgba(246,162,74,0)");
  g.fillStyle = grd; g.beginPath(); g.arc(0, 0, u(-75) - u(-125), 0, Math.PI * 2); g.fill(); g.restore();
  g.fillStyle = "#8cbf6e"; g.strokeStyle = "#5f8f4c"; g.lineWidth = 2.5; g.lineJoin = "round";
  for (const poly of WORLD) {
    g.beginPath();
    poly.forEach(([lon, lat], i) => (i ? g.lineTo(u(lon), v(lat)) : g.moveTo(u(lon), v(lat))));
    g.closePath(); g.fill(); g.stroke();
  }

}

  const rp = ribbonGeo.attributes.position.array, rc = ribbonGeo.attributes.color.array;
  n = 0;
  const hx = new Float32Array(NX + 1), tx = new Float32Array(NX + 1);
  for (let i = 0; i <= NX; i++) { const x = (X0 + INSET) + (i / NX) * BW; hx[i] = thermoDepth(x, 0, st); tx[i] = sst(x, 0, st); }
  for (let j = 0; j <= NY; j++) {
    const d = (j / NY) * DEPTH;
    for (let i = 0; i <= NX; i++, n++) {
      const x = (X0 + INSET) + (i / NX) * BW, h = hx[i];
      fp[n * 3] = x; fp[n * 3 + 1] = j === 0 ? surfaceY(x, FRONT, t, st) : -d; fp[n * 3 + 2] = FRONT;
      ramp(SST_STOPS, tx[i] - 2.2 * (d / Math.max(h, 0.5)), tmpC);
      tmpC2.lerpColors(DEEP_TOP, DEEP_BOT, clamp((d - h) / Math.max(DEPTH - h, 1)));
      tmpC.lerp(tmpC2, smooth(h - 0.45, h + 0.45, d));
      fc[n * 3] = tmpC.r; fc[n * 3 + 1] = tmpC.g; fc[n * 3 + 2] = tmpC.b;
    }
  }
  faceGeo.attributes.position.needsUpdate = faceGeo.attributes.color.needsUpdate = true;
  n = 0;
  for (let j = 0; j <= 1; j++) for (let i = 0; i <= NX; i++, n++) {
    const x = (X0 + INSET) + (i / NX) * BW;
    rp[n * 3] = x; rp[n * 3 + 1] = -hx[i] + (j ? -0.13 : 0.13); rp[n * 3 + 2] = FRONT + 0.03;
    rc[n * 3] = rc[n * 3 + 1] = rc[n * 3 + 2] = 1;
  }
  ribbonGeo.attributes.position.needsUpdate = true;

  // trade-wind arrows (move with the integrated wind, so speed changes never jump)
  const off = windInt(t) * 3.2;
  const L = 2.6 * (0.3 + 0.7 * Math.min(Math.abs(st.wind), 1.6));
  let k = 0;
  for (let r = 0; r < ROWS.length; r++) for (let c = 0; c < COLS; c++, k++) {
    const z = ROWS[r], lat = latOfZ(z);
    const x = SPAN_E - fract((c * SPAN / COLS + off + r * 4.1) / SPAN) * SPAN;
    const edge = smooth(SPAN_W, SPAN_W + 7, x) * (1 - smooth(Math.min(SPAN_E, coastX(lat) - 3) - 6, Math.min(SPAN_E, coastX(lat) - 3), x));
    const s = st.windVis * edge;
    if (s < 0.01) { trade.setMatrixAt(k, HIDE); continue; }
    tmpS.set(L * s, s, s);
    tmpM.compose(tmpV.set(x, 1.6 + 0.08 * Math.sin(t * 2 + k), z), Q_WEST, tmpS);
    trade.setMatrixAt(k, tmpM);
  }
  trade.instanceMatrix.needsUpdate = true;
  // westerly wind burst arrows
  for (let i = 0; i < burst.count; i++) {
    const x = -46 + fract(i / burst.count * 3 + t * 0.09) * 34, z = -2.6 + (i % 3) * 2.6 + (i % 2) * 0.6;
    const s = st.burst * smooth(-46, -41, x) * (1 - smooth(-17, -12, x));
    if (s < 0.01) { burst.setMatrixAt(i, HIDE); continue; }
    tmpM.compose(tmpV.set(x, 1.9, z), Q_EAST, tmpS.set(2.4 * s, s, s));
    burst.setMatrixAt(i, tmpM);
  }
  burst.instanceMatrix.needsUpdate = true;

  // Walker circulation
  if (st.walkerVis > 0.01) {
    const curve = walkerCurve(st.xR, st.xS);
    walkerTube.geometry.dispose();
    walkerTube.geometry = new THREE.TubeGeometry(curve, 160, 0.3, 6, true);
    walkerMat.opacity = 0.42 * st.walkerVis * (0.5 + 0.5 * st.walk);
    walkerTube.visible = true;
    const ph = walkInt(t) * 0.05;
    for (let i = 0; i < CHEV; i++) {
      const u = fract(i / CHEV + ph);
      const p = curve.getPointAt(u), tan = curve.getTangentAt(u);
      tmpQ.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan);
      const s = st.walkerVis * (0.55 + 0.45 * Math.min(st.walk, 1.2));
      tmpM.compose(p, tmpQ, tmpS.set(s, s, s));
      chevrons.setMatrixAt(i, tmpM);
    }
  } else {
    walkerTube.visible = false;
    for (let i = 0; i < CHEV; i++) chevrons.setMatrixAt(i, HIDE);
  }
  chevrons.instanceMatrix.needsUpdate = true;

  // clouds + rain
  const rpos = rainGeo.attributes.position.array;
  let pi = 0, ri = 0;
  for (const tw of towerDefs) {
    const inten = tw.c === 0 ? st.cW : st.cC;
    const grow = clamp(inten * TOWERS * 1.05 - tw.k * 0.9, 0, 1);
    const g = smooth(0, 1, grow);
    for (const pf of tw.puffs) {
      if (g < 0.02) { cloudMesh.setMatrixAt(pi++, HIDE); continue; }
      const y = 4.6 + pf.f * (tw.height - 4.6) * g;
      const s = pf.s * g * (1 + 0.06 * Math.sin(t * 0.8 + tw.seed + pf.f * 3)) * (pf.f > 0.7 ? 1.25 : 1);
      tmpM.compose(tmpV.set(tw.x + pf.dx * g, y, tw.z + pf.dz), tmpQ.set(0, 0, 0, 1), tmpS.set(s * 1.25, s * 0.9, s));
      cloudMesh.setMatrixAt(pi++, tmpM);
    }
    for (let q = 0; q < RAIN_PER; q++, ri++) {
      const rd = rainDefs[ri];
      if (g < 0.35) { for (let m = 0; m < 6; m++) rpos[ri * 6 + m] = 0; continue; }
      const top = 4.2, y0 = top - fract(rd.ph + t * 1.7) * top;
      const x = tw.x + rd.dx, z = tw.z + rd.dz;
      rpos[ri * 6] = x; rpos[ri * 6 + 1] = y0; rpos[ri * 6 + 2] = z;
      rpos[ri * 6 + 3] = x - 0.12; rpos[ri * 6 + 4] = Math.max(0.05, y0 - 1.1); rpos[ri * 6 + 5] = z;
    }
  }
  cloudMesh.instanceMatrix.needsUpdate = true;
  rainGeo.attributes.position.needsUpdate = true;

  // upwelling particles on the cross-section
  const warmth = clamp(st.e, 0, 1), strength = clamp(st.wind, 0.25, 1.4);
  const up = upPts.geometry.attributes, upP = up.position.array, upC = up.aColor.array, upA = up.aAlpha.array;
  tmpC.lerpColors(COLD_P, WARM_P, warmth);
  for (let i = 0; i < UP_N; i++) {
    const d = upDefs[i], p = fract(d.ph + windInt(t) * 0.045 * d.sp);
    const h = thermoDepth(d.x0, 0, st), d0 = h + 1.8;
    const pe = 1 - (1 - p) * (1 - p);
    upP[i * 3] = d.x0 - 7 * p * p; upP[i * 3 + 1] = -lerp(d0, 0.25, pe); upP[i * 3 + 2] = FRONT + 0.22;
    upC[i * 3] = tmpC.r; upC[i * 3 + 1] = tmpC.g; upC[i * 3 + 2] = tmpC.b;
    upA[i] = st.upVis * strength * smooth(0, 0.12, p) * (1 - smooth(0.85, 1, p)) * 0.95;
  }
  up.position.needsUpdate = up.aColor.needsUpdate = up.aAlpha.needsUpdate = true;
  const sp2 = spreadPts.geometry.attributes, s2P = sp2.position.array, s2C = sp2.aColor.array, s2A = sp2.aAlpha.array;
  for (let i = 0; i < SPREAD_N; i++) {
    const d = spreadDefs[i], p = fract(d.ph + windInt(t) * 0.03 * d.sp);
    const z = bz(d.lat) + d.dz, x = coastX(d.lat) - 1.2 - 26 * p * (0.5 + 0.5 * gauss(d.lat + 1, 6));
    s2P[i * 3] = x; s2P[i * 3 + 1] = 0.22; s2P[i * 3 + 2] = Math.min(z, FRONT - 0.2);
    s2C[i * 3] = tmpC.r; s2C[i * 3 + 1] = tmpC.g; s2C[i * 3 + 2] = tmpC.b;
    s2A[i] = st.upVis * strength * smooth(0, 0.08, p) * (1 - smooth(0.6, 1, p)) * 0.8;
  }
  sp2.position.needsUpdate = sp2.aColor.needsUpdate = sp2.aAlpha.needsUpdate = true;
}

function updateGlobe(t, st) {
  globe.rotation.set(THREE.MathUtils.degToRad(globeLat(t)), -THREE.MathUtils.degToRad(globeLon(t) + 90), 0);
  for (const imp of IMPACTS) {
    const a = at("s07", imp.a);
    const op = smooth(a - 0.2, a + 0.6, t) * (1 - 0.45 * smooth(at("s07", 32.6), at("s07", 33.6), t)) * (inScene("s07", t) ? 1 : 0);
    for (const m of imp.meshes) { m.material.opacity = 0.62 * op; m.visible = op > 0.005; }
  }
  if (st.jetVis > 0.005) {
    buildJet(st.jetShift);
    jetMat.opacity = 0.75 * st.jetVis; jetTube.visible = true; jetPts.visible = true;
    const a = jetPts.geometry.attributes, P = a.position.array, Cc = a.aColor.array, A = a.aAlpha.array;
    for (let i = 0; i < JET_P; i++) {
      const u = fract(i / JET_P + t * (0.08 + 0.05 * st.jetShift)), p = jetCurve.getPointAt(u);
      P[i * 3] = p.x; P[i * 3 + 1] = p.y; P[i * 3 + 2] = p.z;
      Cc[i * 3] = 1; Cc[i * 3 + 1] = 1; Cc[i * 3 + 2] = 1;
      A[i] = st.jetVis * smooth(0, 0.06, u) * (1 - smooth(0.94, 1, u));
    }
    a.position.needsUpdate = a.aColor.needsUpdate = a.aAlpha.needsUpdate = true;
  } else { jetTube.visible = false; jetPts.visible = false; }
}

const camDir = new THREE.Vector3(), worldN = new THREE.Vector3();
function updateOverlay(t, st) {
  for (const it of timed) {
    const op = win(t, it.a, it.b, it.fi, it.fo);
    it.el.style.opacity = op.toFixed(3);
    it.el.style.visibility = op > 0.002 ? "visible" : "hidden";
    if (it.slide) it.el.style.transform = `${it.base} translateY(${((1 - op) * 14).toFixed(2)}px)`;
  }
  // feedback diagrams
  for (const f of Object.values(FB_STEPS)) {
    for (const [k, el] of Object.entries(f.parts)) {
      const on = smooth(f.on[k], f.on[k] + 0.6, t);
      el.style.opacity = (0.22 + 0.78 * on).toFixed(3);
      const path = el.querySelector("path");
      if (path && k.startsWith("a")) path.setAttribute("stroke-dashoffset", (-(t - f.on[k]) * 40 * smooth(f.spin - 1, f.spin, t)).toFixed(1));
    }
  }
  // ENSO chart
  const yr = chartYear(t);
  chartParts.rect.setAttribute("width", chx(yr).toFixed(1));
  chartParts.dot.setAttribute("cx", chx(yr).toFixed(1)); chartParts.dot.setAttribute("cy", chy(ensoIndex(yr)).toFixed(1));
  chartParts.gap.setAttribute("opacity", win(t, at("s09", 18.4), at("s09", 25.4), 0.5, 0.4).toFixed(3));
  chartParts.len.setAttribute("opacity", win(t, at("s09", 21.6), at("s09", 25.4), 0.5, 0.4).toFixed(3));
  recapItems.forEach((li, i) => { li.style.opacity = (0.15 + 0.85 * smooth(RECAP_ON[i], RECAP_ON[i] + 0.5, t)).toFixed(3); });

  // 3D-anchored labels
  camera.getWorldDirection(camDir);
  for (const lb of labels) {
    let op = win(t, lb.a, lb.b, lb.fi, lb.fo);
    let p = null;
    if (op > 0.002) p = lb.anchor(st);
    if (p && lb.facing) {
      worldN.copy(lb.facing()).applyQuaternion(globe.quaternion);
      op *= smooth(0.05, 0.3, -worldN.dot(camDir));
    }
    if (!p || op <= 0.002) { lb.el.style.visibility = "hidden"; lb.line.setAttribute("opacity", "0"); lb.dot.setAttribute("opacity", "0"); continue; }
    const v = p.clone().project(camera);
    if (v.z > 1) { lb.el.style.visibility = "hidden"; lb.line.setAttribute("opacity", "0"); lb.dot.setAttribute("opacity", "0"); continue; }
    const ax = (v.x + 1) / 2 * W, ay = (1 - v.y) / 2 * H;
    const lx = ax + lb.off[0], ly = ay + lb.off[1] + (1 - op) * 10;
    lb.el.style.visibility = "visible"; lb.el.style.opacity = op.toFixed(3);
    lb.el.style.transform = `translate(${lx.toFixed(1)}px, ${ly.toFixed(1)}px) translate(-50%, -50%)`;
    lb.line.setAttribute("x1", ax.toFixed(1)); lb.line.setAttribute("y1", ay.toFixed(1));
    lb.line.setAttribute("x2", lx.toFixed(1)); lb.line.setAttribute("y2", ly.toFixed(1));
    lb.line.setAttribute("opacity", (op * 0.85).toFixed(3));
    lb.dot.setAttribute("cx", ax.toFixed(1)); lb.dot.setAttribute("cy", ay.toFixed(1)); lb.dot.setAttribute("opacity", op.toFixed(3));
  }
  // fades: opening, cuts to/from the globe, final fade-out
  let f = 1 - smooth(0, 0.9, t);
  for (const c of CUTS) f = Math.max(f, 1 - smooth(0, 0.6, Math.abs(t - c)));
  f = Math.max(f, smooth(TOTAL - 0.9, TOTAL - 0.1, t));
  document.getElementById("fade").style.opacity = f.toFixed(3);
}

function renderAt(t) {
  t = clamp(t, 0, TOTAL - 1e-4);
  const st = stateAt(t);
  basin.visible = !st.globe; globe.visible = st.globe;
  cameraAt(t);
  if (!st.globe) updateBasin(t, st); else updateGlobe(t, st);
  scene.updateMatrixWorld();
  updateOverlay(t, st);
  renderer.render(scene, camera);
  return t;
}

/* ============================================================== entry points */
window.TOTAL_SECONDS = TOTAL;
window.renderAt = renderAt;
await document.fonts.ready;
await Promise.all([400, 600, 700, 800].map(w => document.fonts.load(`${w} 20px InterV`)));
renderAt(params.has("t") ? parseFloat(params.get("t")) : 0);
window.__ready = true;

if (PREVIEW) {
  const stage = document.getElementById("stage"), controls = document.getElementById("controls");
  controls.style.display = "flex";
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), btn = document.getElementById("play");
  scrub.max = TOTAL;
  const audios = CFG.scenes.map(s => { const a = new Audio(`/audio/${s.id}.wav`); a.preload = "auto"; return a; });
  let playing = false, t0 = 0, wall0 = 0, cur = 0, curScene = -1;
  const sceneIndex = t => CFG.scenes.findIndex(s => t >= S[s.id].start && t < S[s.id].end);
  const syncAudio = t => {
    const i = sceneIndex(t);
    if (i !== curScene) { audios.forEach(a => a.pause()); curScene = i; if (playing && i >= 0) { audios[i].currentTime = t - S[CFG.scenes[i].id].start; audios[i].play().catch(() => {}); } }
  };
  const show = t => { cur = t; renderAt(t); scrub.value = t; clock.textContent = `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`; };
  scrub.addEventListener("input", () => { playing = false; btn.textContent = "Play"; audios.forEach(a => a.pause()); curScene = -1; show(parseFloat(scrub.value)); });
  btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; t0 = cur; wall0 = performance.now(); curScene = -1; if (!playing) audios.forEach(a => a.pause()); });
  const loop = () => { if (playing) { const t = t0 + (performance.now() - wall0) / 1000; if (t >= TOTAL) { playing = false; btn.textContent = "Play"; } show(Math.min(t, TOTAL)); syncAudio(t); } requestAnimationFrame(loop); };
  show(params.has("t") ? parseFloat(params.get("t")) : 0);
  loop();
}
</script>
