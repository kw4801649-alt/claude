<title>How El Niño Forms — The Pacific, seen in heat</title>
<!--
  scene/index.html — "The Pacific, seen in heat".

  One continuous camera move over a dark, infrared dot-matrix planet. No interface
  chrome: no title bars, chapter chips, label pills or cards. Ocean temperature is
  colour, winds and currents are streaks of light, and the key words live inside the
  physics (they blow away, pile up, rise from the deep, ride waves, crumble, drip).

  Everything is timed to the narration: audio/timings.json (written by tools/tts.py)
  holds the start and end of every spoken sentence, and cue(scene, "phrase") turns a
  phrase into the moment it is spoken. Change the voice or the script, re-run the TTS,
  and the pictures re-sync.

  Determinism: every frame is a pure function of the time t (no clocks, no
  Math.random — a seeded PRNG is used), so frames can be rendered in any order.

  Served by render/serve.mjs from the project root:
    /scene/index.html            render mode, exposes window.renderAt(t)
    /scene/index.html?preview=1  scrubber + playback with narration
    /scene/index.html?t=95       one still
-->

  WD.done();
  let s = 0;
  const cb = 0.18 + 0.32 * Math.max(wv, 0.25 * pacVis(t));
  tc.copy(COAST_C).multiplyScalar(cb);
  for (const p of POLYS) for (let j = 0; j < p.pts.length; j++) {
    const a = p.pts[j], c = p.pts[(j + 1) % p.pts.length];
    seg(CL, s++, va.set(a[0], 0.05, a[1]), vb.set(c[0], 0.05, c[1]), tc, tc);
  }
  CL.done();
  const lv = lineVis(t), ld = lineDraw(t);
  seg(EQ, 0, va.set(WX0, 0.12, 0), vb.set(lerp(WX0, WX1, ld), 0.12, 0), tc.set(0.25, 0.25, 0.25).multiplyScalar(lv), tc2.set(1.4, 1.33, 1.2).multiplyScalar(lv));
  EQ.done();
}

function updatePacific(t, st) {
  const fl = flowInt(t), dr = st.drain;
  const grazing = clamp((camera.position.y - 1) / 30, 0.12, 1);          // edge-on views pile up additive dots
  const pv = pacVis(t) * 0.42 * grazing;
  for (let i = 0; i < pacDots.length; i++) {
    const d = pacDots[i], lat = latOfZ(d.z);
    const x = d.x + (fract(d.ph + fl * 0.35) - 0.5) * 0.52;
    const zz = d.z + (dr > 0 ? -Math.sign(d.z || 1) * fract(d.ph2 + t * 0.4) * 0.52 * dr * gauss(lat, 8) : 0);
    PD.P[i * 3] = x; PD.P[i * 3 + 1] = surfaceY(x, zz, t, st); PD.P[i * 3 + 2] = zz;
    const T = sst(x, zz, st);
    ramp(IR, T, tc);
    const edge = smooth(-24, -14, lat) * (1 - smooth(22, 30, lat)) * smooth(BX0 - 4, BX0 + 2, x);
    let b = (0.35 + 0.65 * smooth(24, 29.5, T)) * (0.25 + 0.75 * edge);
    b = lerp(b, 0.35 * st.worldVis, 1 - edge);
    PD.Sz[i] = 0.3 + 0.12 * smooth(27.5, 30, T);
    addC(PD.Cc, i, tc, b * pv);
  }
  for (const im of IMPACTS) {   // impacts that land in the Pacific layer (Peru floods, East-Pacific storms)
    if (!(im.key === "peru" || im.key === "epac")) continue;
    const k = impactOn(im, t);
    if (k < 0.01) continue;
    for (let i = 0; i < pacDots.length; i++) {
      const w = k * (1 - smooth(im.rr * 0.5, im.rr, Math.hypot(PD.P[i * 3] - im.x, PD.P[i * 3 + 2] - im.z)));
      if (w > 0) for (let c = 0; c < 3; c++) PD.Cc[i * 3 + c] = lerp(PD.Cc[i * 3 + c], [im.color.r, im.color.g, im.color.b][c] * 1.6, w);
    }
  }
  PD.done();

  // wind streaks (westward; speed follows the integrated wind) + westerly bursts (eastward)
  const wi = windInt(t), wnd = clamp(st.wind, 0, 1.7);
  const Lw = 1.0 + 3.6 * wnd / 1.7, bw = st.windVis * (0.25 + 0.75 * wnd / 1.7);
  for (let i = 0; i < WIND_N; i++) {
    const d = windDefs[i], f = fract(d.ph + wi * 0.016 * d.sp);
    const x = 46 - f * 102, lat = latOfZ(d.z);
    const life = smooth(0, 0.06, f) * (1 - smooth(0.9, 1, f)) * (1 - smooth(coastX(lat) - 5, coastX(lat) - 1, x));
    seg(WS, i, va.set(x, d.y, d.z), vb.set(x + Lw, d.y, d.z), tc.copy(WIND_C).multiplyScalar(bw * life * 0.5), BLACK);
  }
  const bi = burstInt(t);
  for (let i = 0; i < BURST_N; i++) {
    const d = burstDefs[i], f = fract(d.ph + bi * 0.09 * d.sp);
    const x = -48 + f * 40, life = smooth(0, 0.1, f) * (1 - smooth(0.8, 1, f));
    seg(WS, WIND_N + i, va.set(x, d.y, d.z), vb.set(x - 3.2, d.y, d.z), tc.copy(BURST_C).multiplyScalar(0.9 * st.burst * life), BLACK);
  }
  WS.done();

  // Walker circulation comets
  walkerCache = walkerPoints(st.xR, st.xS);
  const wkp = walkInt(t) * 0.045, wb = st.walkerVis * (0.4 + 0.6 * Math.min(st.walk, 1.3));
  tc.set(0.85, 0.92, 1).multiplyScalar(1.1 * wb);
  for (let i = 0; i < WALK_N; i++) {
    const u = fract(i / WALK_N + wkp);
    seg(WK, i, samplePts(walkerCache, u, va), samplePts(walkerCache, u - 0.045, vb), tc, BLACK);
  }
  WK.done();

  // clouds + rain
  let ci = 0, ri = 0;
  for (const tw of towerDefs) {
    const g = smooth(0, 1, clamp((tw.c === 0 ? st.cW : st.cC) * TOWERS * 1.05 - tw.k * 0.9, 0, 1));
    for (const p of tw.pts) {
      const sw = 1 + 0.06 * Math.sin(t * 0.9 + p.f * 7 + tw.k);
      CLD.P[ci * 3] = tw.x + p.dx * g * sw; CLD.P[ci * 3 + 1] = 4.2 + p.f * (tw.height - 4.2) * g; CLD.P[ci * 3 + 2] = tw.z + p.dz * g * sw;
      addC(CLD.Cc, ci, CLOUD_C, 0.075 * g * (0.6 + 0.4 * p.f));
      CLD.Sz[ci] = 0.9 * p.s;
      ci++;
    }
    for (let q = 0; q < RAIN_PER; q++, ri++) {
      const rd = rainDefs[ri];
      if (g < 0.35) { seg(RN, ri, OFF, OFF, BLACK, BLACK); continue; }
      const y0 = 4.0 - fract(rd.ph + t * 1.7) * 4.0, x = tw.x + rd.dx, z = tw.z + rd.dz;
      seg(RN, ri, va.set(x, y0, z), vb.set(x - 0.12, Math.max(0.05, y0 - 1.2), z), tc.copy(RAIN_C).multiplyScalar(0.9 * g), BLACK);
    }
  }
  CLD.done(); RN.done();

  // equatorial slab of light
  const cv = st.colVis;
  const nx = Math.round((BX1 - BX0) / 0.9) + 2, hx = new Float32Array(nx), tx = new Float32Array(nx);
  for (let i = 0; i < nx; i++) { const x = BX0 + i * 0.9; hx[i] = thermoDepth(x, 0, st); tx[i] = sst(x, 0, st); }
  for (let i = 0; i < slab.length; i++) {
    const s0 = slab[i], ix = Math.min(nx - 1, Math.round((s0.x - BX0) / 0.9)), h = hx[ix];
    SL.P[i * 3] = s0.x; SL.P[i * 3 + 1] = -s0.d; SL.P[i * 3 + 2] = s0.z;
    if (cv < 0.01) { addC(SL.Cc, i, BLACK, 0); SL.Sz[i] = 0; continue; }
    let b;
    if (s0.d < h) { ramp(IR, tx[ix] - 2.6 * (s0.d / Math.max(h, 0.5)), tc); b = 0.55; }
    else { tc.copy(DEEP_C); b = 0.6 * (1 - 0.6 * (s0.d - h) / DEPTH); }
    const near = gauss(s0.d - h, 0.45);
    tc.lerp(MEM_C1, 0.8 * near); b += 1.1 * near;
    addC(SL.Cc, i, tc, 0.45 * b * cv);
    SL.Sz[i] = 0.26;
  }
  SL.done();
  // thermocline membrane net
  const mv = st.memVis;
  let m = 0;
  if (mv > 0.005) {
    for (let j = 0; j <= MNZ; j++) for (let i = 0; i < MNX; i++) {
      const x0 = memXs[i], x1 = memXs[i + 1], z = memZs[j], xm = (x0 + x1) / 2;
      const h0 = thermoDepth(x0, z, st), hm = thermoDepth(xm, z, st), h1 = thermoDepth(x1, z, st);
      tc.lerpColors(MEM_C1, MEM_C2, clamp(h0 / 10)).multiplyScalar(0.55 * mv); tc2.lerpColors(MEM_C1, MEM_C2, clamp(h1 / 10)).multiplyScalar(0.55 * mv);
      seg(MEM, m++, va.set(x0, -h0, z), vb.set(xm, -hm, z), tc, tc2);
      seg(MEM, m++, va.set(xm, -hm, z), vb.set(x1, -h1, z), tc2, tc2);
    }
    for (let i = 0; i <= MNX; i++) for (let j = 0; j < MNZ; j++) {
      const x = memXs[i], z0 = memZs[j], z1 = memZs[j + 1], h0 = thermoDepth(x, z0, st), h1 = thermoDepth(x, z1, st);
      tc.lerpColors(MEM_C1, MEM_C2, clamp(h0 / 10)).multiplyScalar(0.3 * mv); tc2.lerpColors(MEM_C1, MEM_C2, clamp(h1 / 10)).multiplyScalar(0.3 * mv);
      seg(MEM, m++, va.set(x, -h0, z0), vb.set(x, -h1, z1), tc, tc2);
    }
  }
  MEM.done(m);

  // upwelling spirals
  const strength = clamp(st.wind, 0.25, 1.5);
  tc2.lerpColors(COLD_P, WARM_P, clamp(st.e, 0, 1));
  for (let i = 0; i < UP_N; i++) {
    const d = upDefs[i], p = fract(d.ph + windInt(t) * 0.04 * d.sp);
    const h = thermoDepth(d.x0, d.z0, st), pe = 1 - (1 - p) * (1 - p), ang = d.a + p * 9, rad = 0.7 * (1 - p);
    UP.P[i * 3] = d.x0 + Math.cos(ang) * rad - 6 * p * p; UP.P[i * 3 + 1] = -lerp(h + 2.2, 0.2, pe); UP.P[i * 3 + 2] = d.z0 + Math.sin(ang) * rad;
    addC(UP.Cc, i, tc2, 0.9 * st.upVis * strength * smooth(0, 0.12, p) * (1 - smooth(0.85, 1, p)));
    UP.Sz[i] = 0.42;
  }
  UP.done();
}

function updateBig(t, st) {
  // Bjerknes ring + comet
  const rv = ringVis(t), phi = ringPhi(t), trail = t > S("s05") ? -1 : 1;
  if (rv > 0.005) {
    tc.set(0.5, 0.6, 0.85).multiplyScalar(0.35 * rv);
    for (let i = 0; i < 120; i++) seg(RINGL, i, ringPos(i * 3), ringPos(i * 3 + 3), tc, tc);
    for (let i = 0; i < 120; i++) {
      tc.set(1, 0.85, 0.6).multiplyScalar(2.6 * Math.pow(1 - i / 120, 2.2) * rv);
      tc2.set(1, 0.85, 0.6).multiplyScalar(2.6 * Math.pow(1 - (i + 1) / 120, 2.2) * rv);
      seg(RINGL, 120 + i, ringPos(phi + trail * i * 0.9), ringPos(phi + trail * (i + 1) * 0.9), tc, tc2);
    }
  }
  RINGL.done(rv > 0.005 ? 240 : 0);

  // jet stream
  const jv = jetVis(t);
  if (jv > 0.005) {
    jetCache = jetPts(jetShift(t));
    for (let i = 0; i < JET_CN; i++) {
      const u = fract(i / JET_CN + t * 0.11);
      tc.set(1, 1, 1).multiplyScalar(1.6 * jv * smooth(0, 0.05, u) * (1 - smooth(0.95, 1, u)));
      seg(JT, i, sampleOpen(jetCache, u, va), sampleOpen(jetCache, Math.max(0, u - 0.02), vb), tc, BLACK);
    }
    JT.done();
  } else { jetCache = null; JT.done(0); }
  // storms riding the jet into the southern US
  const sv = stormVis(t);
  for (let s = 0; s < 3; s++) for (let j = 0; j < 60; j++) {
    const idx = s * 60 + j;
    if (sv < 0.01 || !jetCache) { STORM.Sz[idx] = 0; addC(STORM.Cc, idx, BLACK, 0); continue; }
    sampleOpen(jetCache, clamp(0.48 + 0.12 * s + (t - cue("s06", "steering storms")) * 0.05, 0, 0.98), va);
    const arm = j % 3, r = 0.25 + (j / 60) * 2.6, ang = arm * 2.09 + r * 1.3 - t * 3;
    STORM.P[idx * 3] = va.x + Math.cos(ang) * r; STORM.P[idx * 3 + 1] = 2.5; STORM.P[idx * 3 + 2] = va.z + 2.5 + Math.sin(ang) * r;
    addC(STORM.Cc, idx, tc.set(0.75, 0.85, 1), 1.2 * sv * (1 - j / 70)); STORM.Sz[idx] = 0.5;
  }
  STORM.done();

  // teleconnection arcs from the warm Pacific to each impact region
  const tv = teleVis(t), tp = teleProg(t);
  let ti = 0;
  const src = V3(LX(-140), 0.5, LZ(0));
  for (const im of IMPACTS) {
    const dst = V3(im.x, 0.5, im.z), mid = src.clone().lerp(dst, 0.5); mid.y = 10 + 0.18 * src.distanceTo(dst);
    const bez = (u, out) => out.set(0, 0, 0).addScaledVector(src, (1 - u) * (1 - u)).addScaledVector(mid, 2 * u * (1 - u)).addScaledVector(dst, u * u);
    for (let j = 0; j < 60; j++) {
      const u0 = j / 60, u1 = (j + 1) / 60;
      if (tv < 0.005 || u1 > tp) { seg(TELE, ti++, OFF, OFF, BLACK, BLACK); continue; }
      tc.set(1, 0.8, 0.55).multiplyScalar(tv * (0.35 + 1.8 * gauss(u1 - tp, 0.06)));
      seg(TELE, ti++, bez(u0, va), bez(u1, vb), tc, tc);
    }
  }
  TELE.done();
  // impact rings
  let ri = 0;
  for (const im of IMPACTS) {
    const u = t - im.t, k = u > 0 && u < 2.5 ? 1 - u / 2.5 : 0, rad = im.rr * (0.3 + 1.4 * easeOut(u / 2.5));
    tc.copy(im.color).multiplyScalar(1.6 * k);
    for (let j = 0; j < 64; j++) {
      const a0 = j / 64 * Math.PI * 2, a1 = (j + 1) / 64 * Math.PI * 2;
      seg(RINGS, ri++, va.set(im.x + Math.cos(a0) * rad, 0.3, im.z + Math.sin(a0) * rad), vb.set(im.x + Math.cos(a1) * rad, 0.3, im.z + Math.sin(a1) * rad), tc, tc);
    }
  }
  RINGS.done();

  // the heartbeat line
  const bv = beatVis(t), yr = beatYear(t);
  const colOf = (v, out) => out.copy(v > 0.5 ? HOT_C : v < -0.5 ? ICE_C : NEUT_C);
  for (let i = 0; i < BEAT_N; i++) {
    const y0 = i / BEAT_N * BEAT.years, y1 = (i + 1) / BEAT_N * BEAT.years, v0 = ensoIndex(y0), v1 = ensoIndex(y1);
    const vis = y1 <= yr ? 1.6 * bv : 0;
    seg(BEATL, i, va.set(lerp(BEAT.x0, BEAT.x1, y0 / 20), BEAT.y + v0 * BEAT.amp, BEAT.z), vb.set(lerp(BEAT.x0, BEAT.x1, y1 / 20), BEAT.y + v1 * BEAT.amp, BEAT.z),
      colOf(v0, tc).multiplyScalar(vis), colOf(v1, tc2).multiplyScalar(vis));
  }
  BEATL.done();
  const gv = ghostVis(t);
  if (gv > 0.005) {
    for (let g = 0; g < GHOSTS; g++) {
      const off = g * 3.7 + 2, k = gv * 0.55 * Math.pow(0.82, g);
      tc.set(0.8, 0.85, 1).multiplyScalar(k);
      for (let i = 0; i < 160; i++) {
        const y0 = i / 160 * 20, y1 = (i + 1) / 160 * 20;
        seg(GHL, g * 160 + i, va.set(lerp(-100, 100, y0 / 20), BEAT.y + ensoIndex(y0 + off) * BEAT.amp, BEAT.z - 16 * (g + 1)),
          vb.set(lerp(-100, 100, y1 / 20), BEAT.y + ensoIndex(y1 + off) * BEAT.amp, BEAT.z - 16 * (g + 1)), tc, tc);
      }
    }
  }
  GHL.done(gv > 0.005 ? GHOSTS * 160 : 0);
  CURSOR.P[0] = lerp(BEAT.x0, BEAT.x1, yr / 20); CURSOR.P[1] = BEAT.y + ensoIndex(yr) * BEAT.amp; CURSOR.P[2] = BEAT.z;
  addC(CURSOR.Cc, 0, tc.set(1, 1, 1), 2.5 * bv); CURSOR.Sz[0] = 1.6; CURSOR.done();

  // the sun
  SUN.P[0] = SUN_POS.x; SUN.P[1] = SUN_POS.y; SUN.P[2] = SUN_POS.z;
  addC(SUN.Cc, 0, tc.set(1, 0.88, 0.66), 1.1 * sunVis(t) * pacVis(t)); SUN.Sz[0] = 28; SUN.done();
}

function renderAt(t) {
  t = clamp(t, 0, TOTAL - 1e-4);
  const st = stateAt(t);
  cameraAt(t);
  camera.updateMatrixWorld();
  updateWorld(t, st);
  updatePacific(t, st);
  updateBig(t, st);
  updateWords(t, st);
  const f = Math.max(1 - smooth(0.05, 0.8, t), smooth(TOTAL - 1.0, TOTAL - 0.1, t));
  document.getElementById("fade").style.opacity = f.toFixed(3);
  composer.render();
  return t;
}

/* =================================================================== entry points */
await document.fonts.ready;
await Promise.all([document.fonts.load("italic 900 100px FrauncesV", "El Niño"), document.fonts.load("500 100px MonoV", "0123")]);
buildAtlas();
layoutWords();
buildGlyphMesh();
window.TOTAL_SECONDS = TOTAL;
window.renderAt = renderAt;
window.__dbg = () => ({ glyphs: glyphMesh.count, words: TEXTS.map(e => [e.text, +e.t0.toFixed(2), +e.t1.toFixed(2)]) });
renderAt(params.has("t") ? parseFloat(params.get("t")) : 0);
window.__ready = true;

if (PREVIEW) {
  const stage = document.getElementById("stage"), controls = document.getElementById("controls");
  controls.style.display = "flex";
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), btn = document.getElementById("play");
  scrub.max = TOTAL;
  const audios = CFG.scenes.map(s => { const a = new Audio(`/audio/${s.id}.wav`); a.preload = "auto"; return a; });
  let playing = false, t0 = 0, wall0 = 0, cur = 0, curScene = -1;
  const sceneIndex = t => CFG.scenes.findIndex(s => t >= S(s.id) && t < E(s.id));
  const syncAudio = t => {
    const i = sceneIndex(t);
    if (i !== curScene) { audios.forEach(a => a.pause()); curScene = i; if (playing && i >= 0) { audios[i].currentTime = t - S(CFG.scenes[i].id); audios[i].play().catch(() => {}); } }
  };
  const show = t => { cur = t; renderAt(t); scrub.value = t; clock.textContent = `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`; };
  scrub.addEventListener("input", () => { playing = false; btn.textContent = "Play"; audios.forEach(a => a.pause()); curScene = -1; show(parseFloat(scrub.value)); });
  btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; t0 = cur; wall0 = performance.now(); curScene = -1; if (!playing) audios.forEach(a => a.pause()); });
  const loop = () => { if (playing) { const t = t0 + (performance.now() - wall0) / 1000; if (t >= TOTAL) { playing = false; btn.textContent = "Play"; } show(Math.min(t, TOTAL)); syncAudio(t); } requestAnimationFrame(loop); };
  show(params.has("t") ? parseFloat(params.get("t")) : 0);
  loop();
}
</script>
