<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Reading Motion and Momentum Graphs</title>
<!--
  scene/index.html: "Reading Motion and Momentum Graphs" (IB Physics SL, A.1 + A.2)

  One long blueprint-style sheet. The camera glides from graph to graph. Every curve is
  drawn live while a cart, ball or projectile moves; tangents, shaded areas and guides show
  what the gradient and the area mean; equations (KaTeX) write themselves on the spoken word.

  Timing: audio/timings.json (from tools/tts.py) holds every spoken sentence;
  cue(scene, "phrase") gives the moment a phrase is spoken.
  Determinism: every frame is a pure function of t (no clocks, no randomness).
  Served by render/serve.mjs: /scene/index.html (render), ?preview=1 (scrub+audio), ?t=95 (still)
-->
<link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
<style>
  @font-face { font-family: "Hand"; font-weight: 600; src: url("/node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Hand"; font-weight: 700; src: url("/node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #0e1a2b; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #0e1a2b; }
  svg#sheet { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .fo { display: flex; align-items: center; line-height: 1; white-space: nowrap; }
  .fo .katex { font-size: 1em; }
  #fade { position: absolute; inset: 0; background: #0e1a2b; opacity: 1; pointer-events: none; }
  #err { position: absolute; inset: 0; color: #ff8080; font: 28px/1.4 monospace; padding: 80px; display: none; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 12px; align-items: center; padding: 10px 16px;
              background: rgba(10,18,32,0.95); color: #fff; font: 14px/1.2 system-ui, sans-serif; }
  #controls input[type=range] { flex: 1; }
  #controls button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 0; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <svg id="sheet" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M60 0H0V60" fill="none" stroke="#162840" stroke-width="2"/>
      </pattern>
      <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="22" stroke="#5d7088" stroke-width="3"/>
      </pattern>
    </defs>
    <g id="cam"><rect id="paper" x="-4000" y="-3000" width="16000" height="10000" fill="url(#grid)"/><g id="world"></g></g>
  </svg>
  <div id="fade"></div>
  <div id="err"></div>
</div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="500" step="0.0333" value="0">
  <span id="clock">0:00.0</span>
</div>

<script type="module">
import katex from "/node_modules/katex/dist/katex.mjs";

/* ========================================================== timeline from the narration */
const params = new URLSearchParams(location.search);
const PREVIEW = params.has("preview");
const fail = msg => { const e = document.getElementById("err"); e.style.display = "block"; e.textContent = msg; throw new Error(msg); };
const CFG = await (await fetch("/config/scenes.json")).json();
const tlRes = await fetch("/audio/timings.json");
if (!tlRes.ok) fail("audio/timings.json not found. Run `python tools/tts.py` first: the scene is timed to the narration.");
const TL = await tlRes.json();
const TOTAL = TL.total;
const SC = {};
for (const s of CFG.scenes) { const t = TL.scenes[s.id]; if (!t) fail(`timings.json has no ${s.id}; re-run tools/tts.py`); SC[s.id] = { start: t.start, end: t.start + t.slot, t }; }
const S = id => SC[id].start, E = id => SC[id].end;
function cue(id, phrase, { nth = 1, at = "start" } = {}) {
  const p = phrase.toLowerCase(); let count = 0;
  for (const seg of SC[id].t.segments) for (const s of seg.sentences) {
    const txt = s.text.toLowerCase(); let from = 0, idx;
    while ((idx = txt.indexOf(p, from)) >= 0) {
      if (++count === nth) { const k = (at === "end" ? idx + p.length : idx) / txt.length; return SC[id].start + s.start + k * (s.end - s.start); }
      from = idx + 1;
    }
  }
  fail(`Narration cue not found: ${id} "${phrase}" #${nth}`);
}

/* ========================================================== math */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };
const ease = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const D2R = Math.PI / 180;
const ap = (t, t0, d = 0.45) => smooth(t0, t0 + d, t);                 // appear
const win = (t, a, b, fi = 0.45, fo = 0.45) => Math.min(smooth(a, a + fi, t), 1 - smooth(b - fo, b, t));
function track(keys) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t < t1) return t1 - t0 < 1e-6 ? v1 : lerp(v0, v1, ease((t - t0) / (t1 - t0))); }
    return keys[keys.length - 1][1];
  };
}
const fmt = (x, d = 2) => x.toFixed(d);

/* ========================================================== drawing kit (SVG + KaTeX) */
const NS = "http://www.w3.org/2000/svg";
const INK = "#e9eff8", PAPER = "#0e1a2b", MUTED = "#8aa0bf";
const COL = { s: "#3fd0e8", v: "#ffb347", a: "#ff6b9a", F: "#ff7a59", p: "#8fe36b", W: "#ff9a3c", D: "#b98cff", G: "#7be0b0", c1: "#6fb4ff", c2: "#ff8fb3" };
function el(tag, attrs = {}, parent = null) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

const world = document.getElementById("world");

/** A force arrow. draw(x1,y1,x2,y2,{p (grow 0..1), op, dash}) */
function arrow(parent, color, w = 7) {
  const g = el("g", {}, parent);
  const line = el("line", { stroke: color, "stroke-width": w, "stroke-linecap": "round" }, g);
  const head = el("path", { fill: color }, g);
  return {
    g, draw(x1, y1, x2, y2, { p = 1, op = 1, dash = null } = {}) {
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), L = len * p;
      if (op < 0.005 || L < 2) { g.setAttribute("opacity", 0); return; }
      const ux = dx / len, uy = dy / len, hl = Math.min(w * 4.2, L * 0.5), hw = w * 2.3;
      const ex = x1 + ux * L, ey = y1 + uy * L, bx = ex - ux * hl, by = ey - uy * hl;
      set(line, { x1, y1, x2: bx, y2: by, "stroke-dasharray": dash || "none" });
      set(head, { d: `M${ex},${ey}L${bx - uy * hw},${by + ux * hw}L${bx + uy * hw},${by - ux * hw}Z` });
      g.setAttribute("opacity", op);
    } };
}
/** A pen line that draws itself (p 0..1). */
function pen(parent, color = INK, w = 4, extra = {}) {
  const e = el("line", { stroke: color, "stroke-width": w, "stroke-linecap": "round", fill: "none", ...extra }, parent);
  return { e, draw(x1, y1, x2, y2, p = 1, op = 1) { const L = Math.hypot(x2 - x1, y2 - y1); set(e, { x1, y1, x2, y2, opacity: op }); if (!extra["stroke-dasharray"]) set(e, { "stroke-dasharray": `${L} ${L + 1}`, "stroke-dashoffset": L * (1 - clamp(p)) }); } };
}
function poly(parent, attrs) { const e = el("path", attrs, parent); return { e, draw(pts, op = 1, close = true) { e.setAttribute("d", "M" + pts.map(p => `${p[0]},${p[1]}`).join("L") + (close ? "Z" : "")); e.setAttribute("opacity", op); } }; }
/** KaTeX math. at(x, y, op, {anchor:'c'|'l'|'r', rot, scale}) */
function tex(parent, src, { size = 46, color = INK, w = 1100, h = 170 } = {}) {
  const g = el("g", {}, parent);
  const fo = el("foreignObject", { width: w, height: h, y: -h / 2 }, g);
  const div = document.createElement("div");
  div.className = "fo"; div.style.width = w + "px"; div.style.height = h + "px"; div.style.fontSize = size + "px"; div.style.color = color;
  div.innerHTML = katex.renderToString(src, { throwOnError: true, strict: false });
  fo.appendChild(div);
  return { g, div, at(x, y, op = 1, { anchor = "c", rot = 0, scale = 1, dy = 0 } = {}) {
    if (op < 0.005) { g.setAttribute("opacity", 0); return; }
    div.style.justifyContent = anchor === "l" ? "flex-start" : anchor === "r" ? "flex-end" : "center";
    fo.setAttribute("x", anchor === "l" ? 0 : anchor === "r" ? -w : -w / 2);
    g.setAttribute("transform", `translate(${x},${y + dy}) rotate(${rot}) scale(${scale})`);
    g.setAttribute("opacity", op);
  } };
}
/** Handwriting (Caveat) that writes itself letter by letter. */
function hand(parent, text, { size = 52, color = INK, anchor = "start", weight = 600 } = {}) {
  const e = el("text", { "font-family": "Hand", "font-weight": weight, "font-size": size, fill: color, "text-anchor": anchor }, parent);
  return { e, write(x, y, t, t0, { op = 1, speed = 0.035, txt = text, rot = 0 } = {}) {
    const n = Math.floor(txt.length * clamp((t - t0) / Math.max(0.2, txt.length * speed)));
    if (t < t0 || op < 0.005) { e.setAttribute("opacity", 0); return; }
    e.textContent = txt.slice(0, n); set(e, { x, y, opacity: op, transform: rot ? `rotate(${rot} ${x} ${y})` : "" });
  } };
}
/** Angle arc between screen directions a0..a1 (degrees, clockwise from +x on screen). */
function arc(parent, color = INK, w = 3.5) {
  const e = el("path", { stroke: color, "stroke-width": w, fill: "none", "stroke-linecap": "round" }, parent);
  return { e, draw(cx, cy, r, a0, a1, op = 1) {
    if (op < 0.005 || Math.abs(a1 - a0) < 0.3) { e.setAttribute("opacity", 0); return; }
    const p0 = [cx + r * Math.cos(a0 * D2R), cy + r * Math.sin(a0 * D2R)], p1 = [cx + r * Math.cos(a1 * D2R), cy + r * Math.sin(a1 * D2R)];
    const sweep = a1 > a0 ? 1 : 0, large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    set(e, { d: `M${p0[0]},${p0[1]}A${r},${r} 0 ${large} ${sweep} ${p1[0]},${p1[1]}`, opacity: op });
  } };
}
/** Right-angle mark at corner c with unit directions u, v (screen). */
function rightMark(parent, color = INK) {
  const e = el("path", { stroke: color, "stroke-width": 3, fill: "none" }, parent);
  return { draw(c, u, v, s = 26, op = 1) { const a = [c[0] + u[0] * s, c[1] + u[1] * s], b = [a[0] + v[0] * s, a[1] + v[1] * s], d = [c[0] + v[0] * s, c[1] + v[1] * s]; set(e, { d: `M${a[0]},${a[1]}L${b[0]},${b[1]}L${d[0]},${d[1]}`, opacity: op }); } };
}
/** A rectangle "block" centred at (x, y), rotated rot degrees (screen). */
function block(parent, w, h, { fill = "#fbf7ef", stroke = INK } = {}) {
  const e = el("rect", { width: w, height: h, x: -w / 2, y: -h / 2, rx: 6, fill, stroke, "stroke-width": 4 }, parent);
  return { e, at(x, y, rot = 0, op = 1) { set(e, { transform: `translate(${x},${y}) rotate(${rot})`, opacity: op }); } };
}
/** Equation stack: lines appear on cue; a pen underline marks results. */
function eqs(parent, x, y, items, { size = 46, gap = 100 } = {}) {
  const lines = items.map((it, i) => ({ ...it, m: tex(parent, it.tex, { size: it.size || size, color: it.color || INK }), y: it.y ?? y + i * gap,
    ul: it.final ? pen(parent, it.ulColor || COL.FR, 4) : null }));
  return t => { for (const L of lines) {
    const k = ap(t, L.t, 0.4) * (L.until ? 1 - ap(t, L.until, 0.4) : 1);
    L.m.at(x + (L.dx || 0), L.y, k, { anchor: "l", dy: (1 - k) * 12 });
    if (L.ul) L.ul.draw(x + (L.dx || 0) - 6, L.y + (L.uly ?? 40), x + (L.dx || 0) + (L.ulw || 420), L.y + (L.uly ?? 40), ap(t, L.t + 0.5, 0.6), k);
  } };
}
const unit = a => [Math.cos(a * D2R), Math.sin(a * D2R)];   // screen angle, clockwise from +x
const add = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];

/* ========================================================== the sheet layout (a snake of 5 x 3 panels) */
const PW = 2300, PH = 1500;
const POS = { s01: [0, 0], s02: [1, 0], s03: [2, 0], s04: [3, 0], s05: [4, 0], s06: [4, 1], s07: [3, 1], s08: [2, 1], s09: [1, 1], s10: [0, 1], s11: [0, 2], s12: [1, 2], s13: [2, 2], s14: [3, 2], s15: [4, 2] };
const center = id => [POS[id][0] * PW, POS[id][1] * PH];
const SECS = [];
function section(id, build) {
  const [cx, cy] = center(id);
  const g = el("g", { transform: `translate(${cx},${cy})` }, world);
  const c = (p, o) => cue(id, p, o);
  SECS.push({ id, g, update: build(g, c, id) });
}
/** Little handwritten section heading in the corner of each panel (part of the page, not an interface bar). */
function heading(g, num, text, t0) {
  const h = hand(g, `${num}  ${text}`, { size: 58, color: MUTED, weight: 700 });
  const u = pen(g, MUTED, 3);
  return t => { h.write(-880, -440, t, t0, { speed: 0.02 }); u.draw(-884, -420, -884 + 26 * (num.length + text.length + 2) * 0.62 * 58 / 52, -420, ap(t, t0 + 0.4, 0.8), 0.7); };
}

/* ========================================================== graph kit (data coordinates -> SVG) */
const lin = keys => t => {                       // piecewise-LINEAR timing map (keys: [time, value])
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t < t1) return t1 - t0 < 1e-6 ? v1 : lerp(v0, v1, (t - t0) / (t1 - t0)); }
  return keys[keys.length - 1][1];
};
/** cumulative integral of fn on [0,T] (table lookup, deterministic) */
function integ(fn, T, n = 1600) {
  const tab = [0], h = T / n;
  for (let i = 1; i <= n; i++) tab.push(tab[i - 1] + 0.5 * h * (fn((i - 1) * h) + fn(i * h)));
  return t => { const x = clamp(t, 0, T) / h, i = Math.min(n - 1, Math.floor(x)); return lerp(tab[i], tab[i + 1], x - i); };
}
const GRIDC = "#1d3050";
const BAND_NEG = "#ff6b6b";

/** One graph. Geometry in px: width w, height h, time 0..T, value lo..hi. Everything inside is drawn in data coordinates. */
function Graph(parent, { x = 0, y = 0, w = 720, h = 230, T = 8, lo = 0, hi = 10, color = INK, ylab = "", xlab = "t\\,/\\,\\text{s}",
  yticks = [], xticks = [], xtl = true, size = 34 } = {}) {
  const g = el("g", { transform: `translate(${x},${y})` }, parent);
  const X = t => (t / T) * w, Y = v => h * (hi - v) / (hi - lo), y0 = Y(clamp(0, lo, hi));
  const frame = el("g", {}, g);
  let gd = ""; for (const v of yticks) gd += `M0,${Y(v)}H${w}`; for (const t of xticks) gd += `M${X(t)},0V${h}`;
  el("path", { d: gd, stroke: GRIDC, "stroke-width": 2, fill: "none" }, frame);
  el("path", { d: `M0,${h}V-6M0,${y0}H${w + 4}`, stroke: INK, "stroke-width": 3.5, fill: "none", "stroke-linecap": "round" }, frame);
  el("path", { d: `M-9,8L0,-12L9,8ZM${w - 2},${y0 - 9}L${w + 16},${y0}L${w - 2},${y0 + 9}Z`, fill: INK }, frame);
  const tl = (txt, px, py, anchor) => { const e = el("text", { x: px, y: py, "font-family": "Hand", "font-weight": 600, "font-size": 30, fill: MUTED, "text-anchor": anchor }, frame); e.textContent = txt; };
  for (const v of yticks) tl(String(v), -14, Y(v) + 10, "end");
  if (xtl) for (const t of xticks) tl(String(t), X(t), (lo < 0 ? h : y0) + 36, "middle");
  const yl = tex(frame, ylab, { size, color }), xl = xtl ? tex(frame, xlab, { size, color: MUTED }) : null;
  yl.at(18, 4, 1, { anchor: "l" }); if (xl) xl.at(w + 26, y0 + 4, 1, { anchor: "l" });
  const api = { g, frame, X, Y, w, h, T, lo, hi, y0,
    show(op) { frame.setAttribute("opacity", op); },
    /** a curve that draws itself up to time u */
    plot(fn, { color: c = INK, w: sw = 6, from = 0, to = T, n = 240, dash = null } = {}) {
      const e = el("path", { stroke: c, "stroke-width": sw, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      if (dash) e.setAttribute("stroke-dasharray", dash);
      return { e, set(u, op = 1) {
        const b = Math.min(u, to);
        if (op < 0.005 || b <= from) { e.setAttribute("opacity", 0); return; }
        const m = Math.max(2, Math.ceil((b - from) / (to - from) * n)); let d = "";
        for (let i = 0; i <= m; i++) { const t = from + (b - from) * i / m; d += `${i ? "L" : "M"}${X(t).toFixed(1)},${Y(fn(t)).toFixed(1)}`; }
        e.setAttribute("d", d); e.setAttribute("opacity", op);
      } };
    },
    /** shaded band between fnTop and fnBot (default the zero line) from a to b */
    band(fnTop, { color: c = INK, op0 = 0.32, bot = () => 0, part = null } = {}) {
      const e = el("path", { fill: c, stroke: "none" }, g);
      const cl = v => (part === "pos" ? Math.max(v, 0) : part === "neg" ? Math.min(v, 0) : v);
      return { e, set(a, b, op = 1, fill = null) {
        a = clamp(a, 0, T); b = clamp(b, 0, T);
        if (op < 0.005 || b - a < 1e-3) { e.setAttribute("opacity", 0); return; }
        const m = 90; let d = "";
        for (let i = 0; i <= m; i++) { const t = a + (b - a) * i / m; d += `${i ? "L" : "M"}${X(t).toFixed(1)},${Y(cl(fnTop(t))).toFixed(1)}`; }
        for (let i = m; i >= 0; i--) { const t = a + (b - a) * i / m; d += `L${X(t).toFixed(1)},${Y(cl(bot(t))).toFixed(1)}`; }
        e.setAttribute("d", d + "Z"); e.setAttribute("opacity", op0 * op); if (fill) e.setAttribute("fill", fill);
      } };
    },
    dot(c, r = 11) { const e = el("circle", { r, fill: c, stroke: PAPER, "stroke-width": 3 }, g);
      return { e, at(fn, u, op = 1) { set(e, { cx: X(u), cy: Y(fn(u)), opacity: op }); }, atXY(t, v, op = 1) { set(e, { cx: X(t), cy: Y(v), opacity: op }); } }; },
    /** tangent line to fn at u (px half-length len) */
    tangent(c, sw = 5) { const e = el("line", { stroke: c, "stroke-width": sw, "stroke-linecap": "round" }, g);
      return { e, at(fn, u, len = 150, op = 1) {
        const d = 1e-3, k = (fn(u + d) - fn(u - d)) / (2 * d), m = -(k * (h / (hi - lo))) / (w / T), n = Math.hypot(1, m), dx = len / n, dy = m * len / n, cx = X(u), cy = Y(fn(u));
        set(e, { x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, opacity: op });
      } }; },
    /** straight segment between two data points, drawn to progress p */
    seg(c, { sw = 4, dash = null } = {}) { const e = el("line", { stroke: c, "stroke-width": sw, "stroke-linecap": "round" }, g); if (dash) e.setAttribute("stroke-dasharray", dash);
      return { e, at(t1, v1, t2, v2, p = 1, op = 1) { if (op < 0.005 || p <= 0) { e.setAttribute("opacity", 0); return; }
        set(e, { x1: X(t1), y1: Y(v1), x2: lerp(X(t1), X(t2), p), y2: lerp(Y(v1), Y(v2), p), opacity: op }); } }; },

      return { o, at(t, v, op = 1, { dx = 0, dy = 0, anchor = "c" } = {}) { o.at(X(t) + dx, Y(v) + dy, op, { anchor }); } }; },
    note(txt, { size: sz = 40, color: c = INK, anchor = "start", weight = 600 } = {}) { const o = hand(g, txt, { size: sz, color: c, anchor, weight });
      return { o, write(t, v, tt, t0, opt = {}) { const { dx = 0, dy = 0, ...r } = opt; o.write(X(t) + dx, Y(v) + dy, tt, t0, r); } }; },
  };
  return api;
}

/** three (or two) graphs sharing a time axis, stacked on the left of a panel */
const GX = -880, GW = 720, GH = 230, GY3 = [-395, -120, 155];
function stack(parent, T, specs, xticks) {
  const ys = specs.length === 3 ? GY3 : specs.length === 2 ? [-380, -10] : [-330];
  const hs = specs.length === 3 ? GH : specs.length === 2 ? 310 : 520;
  return specs.map((s, i) => Graph(parent, { x: GX, y: ys[i], w: GW, h: hs, T, xticks, xtl: i === specs.length - 1, color: s.color, ...s }));

/* ---------------------------------------------------------- the cart / ball demos (motion representation) */
function cart(parent, { w = 130, h = 62, body = "#d9e6f7", tag = "" } = {}) {
  const g = el("g", {}, parent);
  el("rect", { x: -w / 2, y: -h, width: w, height: h - 12, rx: 12, fill: body, stroke: INK, "stroke-width": 3 }, g);
  for (const wx of [-w * 0.28, w * 0.28]) el("circle", { cx: wx, cy: -14, r: 14, fill: "#14233a", stroke: INK, "stroke-width": 3 }, g);
  let tg = null; if (tag) { tg = el("text", { x: 0, y: -h / 2 - 2, "font-family": "Hand", "font-weight": 700, "font-size": 40, fill: "#14233a", "text-anchor": "middle" }, g); tg.textContent = tag; }
  return { g, at(px, py, op = 1) { g.setAttribute("transform", `translate(${px},${py})`); g.setAttribute("opacity", op); } };
}
/** a track with one cart and velocity / (force|acceleration) arrows above it; returns update(s, v, a, op) */
function demo(g, { x0 = 90, x1 = 700, y = -230, smin = 0, smax = 32, kv = 26, ka = 40, aCol = COL.a, aLab = "a", vLab = "v", tag = "", ticks = 4 } = {}) {
  const tr = el("path", { d: `M${x0 - 30},${y}H${x1 + 30}`, stroke: MUTED, "stroke-width": 4, "stroke-linecap": "round" }, g);
  let td = ""; for (let i = 0; i <= ticks; i++) { const px = x0 + (x1 - x0) * i / ticks; td += `M${px},${y}v14`; } el("path", { d: td, stroke: MUTED, "stroke-width": 3 }, g);
  const cb = cart(g, { tag }), vA = arrow(g, COL.v, 6), aA = arrow(g, aCol, 6), vL = tex(g, vLab, { size: 34, color: COL.v }), aL = tex(g, aLab, { size: 34, color: aCol });
  return (s, v, a, op = 1, showA = true) => {
    const px = x0 + (clamp(s, smin, smax) - smin) / (smax - smin) * (x1 - x0);
    cb.at(px, y, op);
    vA.draw(px, y - 105, px + v * kv, y - 105, { op }); vL.at(px - 22, y - 124, Math.abs(v) * kv > 6 ? op : 0);
    aA.draw(px, y - 150, px + a * ka, y - 150, { op: showA ? op : 0 }); aL.at(px - 22, y - 169, showA && Math.abs(a) * ka > 6 ? op : 0);

}

/** "ladder" of quantities: gradient arrows go down, area arrows go up */
function ladder(g, { x, y0, dy, items, r = 46, size = 50, labels = true, lsize = 40 }) {
  const nodes = items.map((it, i) => { const ng = el("g", {}, g); el("circle", { r, fill: "none", stroke: it.color, "stroke-width": 5 }, ng); const tx = tex(ng, it.tex, { size, color: it.color }); return { ng, tx, y: y0 + i * dy }; });
  const downs = [], ups = [];
  for (let i = 0; i < items.length - 1; i++) { downs.push(arrow(g, INK, 5)); ups.push(arrow(g, INK, 5)); }
  const dl = hand(g, "gradient", { size: lsize, anchor: "end" }), ul = hand(g, "area", { size: lsize, anchor: "start" });
  return (t, tShow, tDown, tUp) => {
    const k = ap(t, tShow, 0.6);
    nodes.forEach(n => { n.ng.setAttribute("transform", `translate(${x},${n.y})`); n.ng.setAttribute("opacity", k); n.tx.at(0, 0, 1); });
    downs.forEach((a, i) => a.draw(x - 28, nodes[i].y + r + 10, x - 28, nodes[i + 1].y - r - 10, { p: ap(t, tDown + i * 0.35, 0.5), op: k }));
    ups.forEach((a, i) => a.draw(x + 28, nodes[i + 1].y - r - 10, x + 28, nodes[i].y + r + 10, { p: ap(t, tUp + i * 0.35, 0.5), op: k }));
    if (labels) { const my = (nodes[0].y + nodes[1].y) / 2 + 12; dl.write(x - 50, my, t, tDown, { op: k, speed: 0.03 }); ul.write(x + 50, my, t, tUp, { op: k, speed: 0.03 }); }

}

/* ========================================================== s14 — collisions on graphs */
section("s14", (g, c, id) => {
  const H = heading(g, "⑭", "collisions on graphs", S(id));
  const T = 7, m1 = 2, m2 = 1, C1 = COL.c1, C2 = COL.c2;
  const F2 = t => (t > 3 && t < 4 ? 4 * (1 - Math.cos(2 * Math.PI * (t - 3))) : 0), F1 = t => -F2(t);
  const p2 = t => (t <= 3 ? 0 : t >= 4 ? 4 : 4 * ((t - 3) - Math.sin(2 * Math.PI * (t - 3)) / (2 * Math.PI))), p1 = t => 6 - p2(t), pt = () => 6;
  const s1 = integ(t => p1(t) / m1, T), s2 = integ(t => p2(t) / m2, T);
  const G = stack(g, T, [{ lo: -9.5, hi: 9.5, yticks: [-8, 8], ylab: "F\\,/\\,\\text{N}", color: INK }, { lo: -1, hi: 8, yticks: [2, 4, 6], ylab: "p\\,/\\,\\text{kg m s}^{-1}", color: COL.p }], [1, 2, 3, 4, 5, 6, 7]);
  const pF2 = G[0].plot(F2, { color: C2, n: 400, from: 2.8, to: 4.2 }), pF1 = G[0].plot(F1, { color: C1, n: 400, from: 2.8, to: 4.2 });
  const bF2 = G[0].band(F2, { color: C2, op0: 0.42, part: "pos" }), bF1 = G[0].band(F1, { color: C1, op0: 0.42, part: "neg" });
  const lA = G[0].label("+4\\ \\text{N s}", { color: C2, size: 36 }), lB = G[0].label("-4\\ \\text{N s}", { color: C1, size: 36 }), mir = G[0].note("mirror images", { size: 40, color: INK });
  const pP1 = G[1].plot(p1, { color: C1, n: 300 }), pP2 = G[1].plot(p2, { color: C2, n: 300 }), pPt = G[1].plot(pt, { color: COL.p, n: 300, dash: "18 11", w: 7 });
  const t1 = G[1].label("\\text{cart }1", { color: C1, size: 34 }), t2 = G[1].label("\\text{cart }2", { color: C2, size: 34 }), tt = G[1].label("\\text{total}", { color: COL.p, size: 34 });
  // carts
  const tr = el("path", { d: "M50,-230H940", stroke: MUTED, "stroke-width": 4, "stroke-linecap": "round" }, g);
  const cA = cart(g, { body: C1, tag: "1" }), cB = cart(g, { body: C2, tag: "2" }), mA = tex(g, "2\\ \\text{kg}", { size: 34, color: C1 }), mB = tex(g, "1\\ \\text{kg}", { size: 34, color: C2 });
  const fA = arrow(g, C1, 7), fB = arrow(g, C2, 7);
  const E1 = eqs(g, 60, -60, [
    { tex: "J_1 = -J_2\\;\\Rightarrow\\;\\Delta p_1 = -\\Delta p_2", t: c("Their areas"), y: -40, size: 44 },
    { tex: "p_1 + p_2 = \\text{constant}", t: c("conservation of momentum"), y: 100, size: 52, final: true, ulw: 460, ulColor: COL.p },
  ]);
  const cS = c("Finally, a collision between two carts"), cM = c("mirror images"), cEq = c("equal and opposite"), cP = c("Now plot the momentum");
  const uA = lin([[cS + 0.4, 0], [cS + 10.4, 7]]), uB = lin([[cP + 0.4, 0], [cP + 8.4, 7]]);
  return t => {
    H(t);
    const fr1 = ap(t, S(id) + 0.5, 0.6), fr2 = ap(t, cP - 0.3, 0.5);
    G[0].show(fr1); G[1].show(fr2);
    const a = uA(t), b = uB(t), u = t < cP + 0.4 ? a : b;
    pF2.set(a, fr1); pF1.set(a, fr1);
    pP1.set(b, fr2); pP2.set(b, fr2); pPt.set(b, fr2);
    const ka = ap(t, cEq, 0.6);
    bF2.set(0, 7 * ka, 1); bF1.set(0, 7 * ka, 1); lA.at(4.15, 4.5, ap(t, cEq + 0.8, 0.5), { anchor: "l" }); lB.at(4.15, -4.5, ap(t, cEq + 0.8, 0.5), { anchor: "l" });
    mir.write(4.25, 0, t, cM, { dx: 0, dy: -12, speed: 0.03 });
    const px1 = 80 + 30 * s1(u), px2 = Math.min(875, 80 + 30 * (13.35 + s2(u))), bump = Math.max(0, 1 - Math.abs(t - (cP + 0.4)) / 0.4), op = fr1 * (1 - bump);
    cA.at(px1, -230, op); cB.at(px2, -230, op); mA.at(px1, -165, op); mB.at(px2, -165, op);
    const cx = (px1 + px2) / 2, f = F2(u), kf = op * (f > 0.05 ? 1 : 0);
    fA.draw(cx, -265, cx - f * 12, -265, { op: kf }); fB.draw(cx, -265, cx + f * 12, -265, { op: kf });
    const cl = c("One line rises"); t1.at(0.3, 6, ap(t, cP + 1.0, 0.4), { dy: -28, anchor: "l" }); t2.at(5.6, 4, ap(t, cl, 0.4), { dy: -28 }); tt.at(0.3, 6, ap(t, c("and the total"), 0.4), { dy: 32, anchor: "l" });
    E1(t);

/* ========================================================== s15 — the two ladders */
section("s15", (g, c, id) => {
  const H = heading(g, "⑮", "the two ladders", S(id));
  const L1 = ladder(g, { x: -300, y0: -330, dy: 190, r: 62, size: 66, lsize: 52, items: [{ tex: "s", color: COL.s }, { tex: "v", color: COL.v }, { tex: "a", color: COL.a }] });
  const L2 = ladder(g, { x: 420, y0: -330, dy: 190, r: 62, size: 66, lsize: 52, items: [{ tex: "p", color: COL.p }, { tex: "F", color: COL.F }] });
  const cap1 = hand(g, "kinematics", { size: 46, anchor: "middle", color: MUTED }), cap2 = hand(g, "forces & momentum", { size: 46, anchor: "middle", color: MUTED });
  const u1 = tex(g, "\\text{m}\\ \\to\\ \\text{m s}^{-1}\\ \\to\\ \\text{m s}^{-2}", { size: 38, color: MUTED }), u2 = tex(g, "\\text{kg m s}^{-1}\\ \\to\\ \\text{N}", { size: 38, color: MUTED });
  const q = ["1   what are the axes?", "2   what do the gradient and the area mean, by their units?", "3   does the graph go below zero, so signs matter?"].map(s => hand(g, s, { size: 58, weight: 700 }));

    u1.at(-300, 175, ap(t, ca + 1.0, 0.6)); u2.at(420, 45, ap(t, c("the area under force is the change in momentum") + 1.0, 0.6));

/* ========================================================== camera: glide from panel to panel, swooping out between them */
const CAM = [];
const key = (t, c, z = 1, r = 0) => CAM.push({ t, c, z, r });
{
  const ids = CFG.scenes.map(s => s.id);
  ids.forEach((id, i) => {
    const [cx, cy] = center(id), last = i === ids.length - 1;
    key(S(id) + (i === 0 ? 0 : 0.9), [cx, cy], 1);
    if (!last) {
      key(E(id) - 0.5, [cx, cy], 1);
      const [nx, ny] = center(ids[i + 1]);
      key((E(id) - 0.5 + S(ids[i + 1]) + 0.9) / 2, [(cx + nx) / 2, (cy + ny) / 2], 0.62);
    }
  });
  const all = [2 * PW, PH];
  key(E("s15") - 5.5, center("s15"), 1);
  key(TOTAL - 0.4, all, 0.168);
}
CAM.sort((a, b) => a.t - b.t);

const cam = document.getElementById("cam");
function cameraAt(t) {
  let i = 0; while (i < CAM.length - 2 && CAM[i + 1].t <= t) i++;
  const a = CAM[i], b = CAM[i + 1], k = ease(clamp((t - a.t) / Math.max(1e-3, b.t - a.t)));
  // zoom interpolates in log space so a big pull-back feels even
  const z = Math.exp(lerp(Math.log(a.z), Math.log(b.z), k)), r = lerp(a.r, b.r, k);
  const cx = lerp(a.c[0], b.c[0], k), cy = lerp(a.c[1], b.c[1], k);
  cam.setAttribute("transform", `translate(960 540) scale(${z}) rotate(${r}) translate(${-cx} ${-cy})`);
}

/* ========================================================== render */
function renderAt(t) {
  t = clamp(t, 0, TOTAL - 1e-4);
  cameraAt(t);
  for (const s of SECS) s.update(t);
  const f = Math.max(1 - smooth(0.05, 0.6, t), smooth(TOTAL - 0.8, TOTAL - 0.05, t));
  document.getElementById("fade").style.opacity = f.toFixed(3);
  return t;
}

await document.fonts.ready;
await Promise.all([document.fonts.load("600 50px Hand", "abc"), document.fonts.load("700 50px Hand", "abc"),
  document.fonts.load("italic 40px KaTeX_Math", "mg"), document.fonts.load("40px KaTeX_Main", "=+"), document.fonts.load("40px KaTeX_Size1", "(")]);
window.TOTAL_SECONDS = TOTAL;
window.renderAt = renderAt;
renderAt(params.has("t") ? parseFloat(params.get("t")) : 0);
window.__ready = true;

if (PREVIEW) {
  const stage = document.getElementById("stage"), controls = document.getElementById("controls");
  controls.style.display = "flex";
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); stage.style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), btn = document.getElementById("play");
  scrub.max = TOTAL;
  const audios = CFG.scenes.map(s => { const a = new Audio(`/audio/${s.id}.wav`); a.preload = "auto"; return a; });
  let playing = false, t0 = 0, wall0 = 0, cur = 0, curScene = -1;
  const sceneIndex = t => CFG.scenes.findIndex(s => t >= S(s.id) && t < E(s.id));
  const syncAudio = t => { const i = sceneIndex(t); if (i !== curScene) { audios.forEach(a => a.pause()); curScene = i; if (playing && i >= 0) { audios[i].currentTime = t - S(CFG.scenes[i].id); audios[i].play().catch(() => {}); } } };
  const show = t => { cur = t; renderAt(t); scrub.value = t; clock.textContent = `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`; };
  scrub.addEventListener("input", () => { playing = false; btn.textContent = "Play"; audios.forEach(a => a.pause()); curScene = -1; show(parseFloat(scrub.value)); });
  btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; t0 = cur; wall0 = performance.now(); curScene = -1; if (!playing) audios.forEach(a => a.pause()); });
  const loop = () => { if (playing) { const t = t0 + (performance.now() - wall0) / 1000; if (t >= TOTAL) { playing = false; btn.textContent = "Play"; } show(Math.min(t, TOTAL)); syncAudio(t); } requestAnimationFrame(loop); };
  show(params.has("t") ? parseFloat(params.get("t")) : 0); loop();
}
