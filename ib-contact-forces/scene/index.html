<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Contact Forces, Derived — worksheet</title>
<!--
  scene/index.html: "Contact Forces, Derived" (IB Physics SL, A.2)

  One long sheet of graph paper. The camera glides from diagram to diagram (and once
  turns the paper so a slope becomes level); every vector is pen-drawn in its own
  colour, angles move, blocks slip and strings flatten, and the equations, typeset with
  KaTeX, write themselves exactly when the narrator says them.

  Timing: audio/timings.json (from tools/tts.py) holds every spoken sentence;
  cue(scene, "phrase") gives the moment a phrase is spoken.
  Determinism: every frame is a pure function of t (no clocks, no randomness).
  Served by render/serve.mjs: /scene/index.html (render), ?preview=1 (scrub+audio), ?t=95 (still)
-->
<link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
<style>
  @font-face { font-family: "Hand"; font-weight: 600; src: url("/node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Hand"; font-weight: 700; src: url("/node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #f4efe4; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #f4efe4; }
  svg#sheet { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .fo { display: flex; align-items: center; line-height: 1; white-space: nowrap; }
  .fo .katex { font-size: 1em; }
  #fade { position: absolute; inset: 0; background: #f4efe4; opacity: 1; pointer-events: none; }
  #err { position: absolute; inset: 0; color: #b00; font: 28px/1.4 monospace; padding: 80px; display: none; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 12px; align-items: center; padding: 10px 16px;
              background: rgba(35,32,28,0.92); color: #fff; font: 14px/1.2 system-ui, sans-serif; }
  #controls input[type=range] { flex: 1; }
  #controls button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 0; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <svg id="sheet" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M60 0H0V60" fill="none" stroke="#e2d9c6" stroke-width="2"/>
      </pattern>
      <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="22" stroke="#bfb4a1" stroke-width="3"/>
      </pattern>
    </defs>
    <g id="cam"><rect id="paper" x="-4000" y="-3000" width="16000" height="10000" fill="url(#grid)"/><g id="world"></g></g>
  </svg>
  <div id="fade"></div>
  <div id="err"></div>
</div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="500" step="0.0333" value="0">
  <span id="clock">0:00.0</span>
</div>

<script type="module">
import katex from "/node_modules/katex/dist/katex.mjs";

/* ========================================================== timeline from the narration */
const params = new URLSearchParams(location.search);
const PREVIEW = params.has("preview");
const fail = msg => { const e = document.getElementById("err"); e.style.display = "block"; e.textContent = msg; throw new Error(msg); };
const CFG = await (await fetch("/config/scenes.json")).json();
const tlRes = await fetch("/audio/timings.json");
if (!tlRes.ok) fail("audio/timings.json not found. Run `python tools/tts.py` first: the scene is timed to the narration.");
const TL = await tlRes.json();
const TOTAL = TL.total;
const SC = {};
for (const s of CFG.scenes) { const t = TL.scenes[s.id]; if (!t) fail(`timings.json has no ${s.id}; re-run tools/tts.py`); SC[s.id] = { start: t.start, end: t.start + t.slot, t }; }
const S = id => SC[id].start, E = id => SC[id].end;
function cue(id, phrase, { nth = 1, at = "start" } = {}) {
  const p = phrase.toLowerCase(); let count = 0;
  for (const seg of SC[id].t.segments) for (const s of seg.sentences) {
    const txt = s.text.toLowerCase(); let from = 0, idx;
    while ((idx = txt.indexOf(p, from)) >= 0) {
      if (++count === nth) { const k = (at === "end" ? idx + p.length : idx) / txt.length; return SC[id].start + s.start + k * (s.end - s.start); }
      from = idx + 1;
    }
  }
  fail(`Narration cue not found: ${id} "${phrase}" #${nth}`);
}

/* ========================================================== math */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };
const ease = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const D2R = Math.PI / 180;
const ap = (t, t0, d = 0.45) => smooth(t0, t0 + d, t);                 // appear
const win = (t, a, b, fi = 0.45, fo = 0.45) => Math.min(smooth(a, a + fi, t), 1 - smooth(b - fo, b, t));
function track(keys) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t < t1) return t1 - t0 < 1e-6 ? v1 : lerp(v0, v1, ease((t - t0) / (t1 - t0))); }
    return keys[keys.length - 1][1];
  };
}
const fmt = (x, d = 2) => x.toFixed(d);
const lin = keys => t => {                       // piecewise-LINEAR timing map (keys: [time, value])
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t < t1) return t1 - t0 < 1e-6 ? v1 : lerp(v0, v1, (t - t0) / (t1 - t0)); }
  return keys[keys.length - 1][1];
};

/* ========================================================== drawing kit (SVG + KaTeX) */
const NS = "http://www.w3.org/2000/svg";
const INK = "#23201c", PAPER = "#f4efe4", MUTED = "#8a8276";
const COL = { W: "#e0701b", N: "#0f8f86", FR: "#c2305f", T: "#4f8a1f", F: "#3346c8", B: "#1d7bd8", D: "#8a3fd1", A: "#7a7368" };
function el(tag, attrs = {}, parent = null) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
const world = document.getElementById("world");

/** A force arrow. draw(x1,y1,x2,y2,{p (grow 0..1), op, dash}) */
function arrow(parent, color, w = 7) {
  const g = el("g", {}, parent);
  const line = el("line", { stroke: color, "stroke-width": w, "stroke-linecap": "round" }, g);
  const head = el("path", { fill: color }, g);
  return {
    g, draw(x1, y1, x2, y2, { p = 1, op = 1, dash = null } = {}) {
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), L = len * p;
      if (op < 0.005 || L < 2) { g.setAttribute("opacity", 0); return; }
      const ux = dx / len, uy = dy / len, hl = Math.min(w * 4.2, L * 0.5), hw = w * 2.3;
      const ex = x1 + ux * L, ey = y1 + uy * L, bx = ex - ux * hl, by = ey - uy * hl;
      set(line, { x1, y1, x2: bx, y2: by, "stroke-dasharray": dash || "none" });
      set(head, { d: `M${ex},${ey}L${bx - uy * hw},${by + ux * hw}L${bx + uy * hw},${by - ux * hw}Z` });
      g.setAttribute("opacity", op);
    } };
}
/** A pen line that draws itself (p 0..1). */
function pen(parent, color = INK, w = 4, extra = {}) {
  const e = el("line", { stroke: color, "stroke-width": w, "stroke-linecap": "round", fill: "none", ...extra }, parent);
  return { e, draw(x1, y1, x2, y2, p = 1, op = 1) { const L = Math.hypot(x2 - x1, y2 - y1); set(e, { x1, y1, x2, y2, opacity: op }); if (!extra["stroke-dasharray"]) set(e, { "stroke-dasharray": `${L} ${L + 1}`, "stroke-dashoffset": L * (1 - clamp(p)) }); } };
}
function poly(parent, attrs) { const e = el("path", attrs, parent); return { e, draw(pts, op = 1, close = true) { e.setAttribute("d", "M" + pts.map(p => `${p[0]},${p[1]}`).join("L") + (close ? "Z" : "")); e.setAttribute("opacity", op); } }; }
/** KaTeX math. at(x, y, op, {anchor:'c'|'l'|'r', rot, scale}) */
function tex(parent, src, { size = 46, color = INK, w = 1100, h = 170 } = {}) {
  const g = el("g", {}, parent);
  const fo = el("foreignObject", { width: w, height: h, y: -h / 2 }, g);
  const div = document.createElement("div");
  div.className = "fo"; div.style.width = w + "px"; div.style.height = h + "px"; div.style.fontSize = size + "px"; div.style.color = color;
  div.innerHTML = katex.renderToString(src, { throwOnError: true, strict: false });
  fo.appendChild(div);
  return { g, div, at(x, y, op = 1, { anchor = "c", rot = 0, scale = 1, dy = 0 } = {}) {
    if (op < 0.005) { g.setAttribute("opacity", 0); return; }
    div.style.justifyContent = anchor === "l" ? "flex-start" : anchor === "r" ? "flex-end" : "center";
    fo.setAttribute("x", anchor === "l" ? 0 : anchor === "r" ? -w : -w / 2);
    g.setAttribute("transform", `translate(${x},${y + dy}) rotate(${rot}) scale(${scale})`);
    g.setAttribute("opacity", op);
  } };
}
/** Handwriting (Caveat) that writes itself letter by letter. */
function hand(parent, text, { size = 52, color = INK, anchor = "start", weight = 600 } = {}) {
  const e = el("text", { "font-family": "Hand", "font-weight": weight, "font-size": size, fill: color, "text-anchor": anchor }, parent);
  return { e, write(x, y, t, t0, { op = 1, speed = 0.035, txt = text, rot = 0 } = {}) {
    const n = Math.floor(txt.length * clamp((t - t0) / Math.max(0.2, txt.length * speed)));
    if (t < t0 || op < 0.005) { e.setAttribute("opacity", 0); return; }
    e.textContent = txt.slice(0, n); set(e, { x, y, opacity: op, transform: rot ? `rotate(${rot} ${x} ${y})` : "" });
  } };
}
/** Angle arc between screen directions a0..a1 (degrees, clockwise from +x on screen). */
function arc(parent, color = INK, w = 3.5) {
  const e = el("path", { stroke: color, "stroke-width": w, fill: "none", "stroke-linecap": "round" }, parent);
  return { e, draw(cx, cy, r, a0, a1, op = 1) {
    if (op < 0.005 || Math.abs(a1 - a0) < 0.3) { e.setAttribute("opacity", 0); return; }
    const p0 = [cx + r * Math.cos(a0 * D2R), cy + r * Math.sin(a0 * D2R)], p1 = [cx + r * Math.cos(a1 * D2R), cy + r * Math.sin(a1 * D2R)];
    const sweep = a1 > a0 ? 1 : 0, large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    set(e, { d: `M${p0[0]},${p0[1]}A${r},${r} 0 ${large} ${sweep} ${p1[0]},${p1[1]}`, opacity: op });
  } };
}
/** Right-angle mark at corner c with unit directions u, v (screen). */
function rightMark(parent, color = INK) {
  const e = el("path", { stroke: color, "stroke-width": 3, fill: "none" }, parent);
  return { draw(c, u, v, s = 26, op = 1) { const a = [c[0] + u[0] * s, c[1] + u[1] * s], b = [a[0] + v[0] * s, a[1] + v[1] * s], d = [c[0] + v[0] * s, c[1] + v[1] * s]; set(e, { d: `M${a[0]},${a[1]}L${b[0]},${b[1]}L${d[0]},${d[1]}`, opacity: op }); } };
}
/** A rectangle "block" centred at (x, y), rotated rot degrees (screen). */
function block(parent, w, h, { fill = "#fbf7ef", stroke = INK } = {}) {
  const e = el("rect", { width: w, height: h, x: -w / 2, y: -h / 2, rx: 6, fill, stroke, "stroke-width": 4 }, parent);
  return { e, at(x, y, rot = 0, op = 1) { set(e, { transform: `translate(${x},${y}) rotate(${rot})`, opacity: op }); } };
}
/** Equation stack: lines appear on cue; a pen underline marks results. */
function eqs(parent, x, y, items, { size = 46, gap = 100 } = {}) {
  const lines = items.map((it, i) => ({ ...it, m: tex(parent, it.tex, { size: it.size || size, color: it.color || INK }), y: it.y ?? y + i * gap,
    ul: it.final ? pen(parent, it.ulColor || COL.FR, 4) : null }));
  return t => { for (const L of lines) {
    const k = ap(t, L.t, 0.4) * (L.until ? 1 - ap(t, L.until, 0.4) : 1);
    L.m.at(x + (L.dx || 0), L.y, k, { anchor: "l", dy: (1 - k) * 12 });
    if (L.ul) L.ul.draw(x + (L.dx || 0) - 6, L.y + (L.uly ?? 40), x + (L.dx || 0) + (L.ulw || 420), L.y + (L.uly ?? 40), ap(t, L.t + 0.5, 0.6), k);
  } };
}
const unit = a => [Math.cos(a * D2R), Math.sin(a * D2R)];   // screen angle, clockwise from +x
const add = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];

/* ========================================================== the sheet layout */
const PW = 2300, PH = 1500;
const ORDER = ["s01", "s02", "s03", "s04", "x1", "s05", "x2", "s06", "s07", "x3", "s08", "x4", "s09", "x5", "s10", "x6", "s11", "x7", "s12", "x8"];
const POS = {}; ORDER.forEach((id, i) => { const r = Math.floor(i / 5), cc = i % 5; POS[id] = [r % 2 ? 4 - cc : cc, r]; });
const center = id => [POS[id][0] * PW, POS[id][1] * PH];
const SECS = [];
function section(id, build) {
  const [cx, cy] = center(id);
  const g = el("g", { transform: `translate(${cx},${cy})` }, world);
  const c = (p, o) => cue(id, p, o);
  SECS.push({ id, g, update: build(g, c, id) });
}
/** Little handwritten section heading in the corner of each panel (part of the page, not an interface bar). */
function heading(g, num, text, t0) {
  const h = hand(g, `${num}  ${text}`, { size: 58, color: MUTED, weight: 700 });
  const u = pen(g, MUTED, 3);
  return t => { h.write(-880, -440, t, t0, { speed: 0.02 }); u.draw(-884, -420, -884 + 26 * (num.length + text.length + 2) * 0.62 * 58 / 52, -420, ap(t, t0 + 0.4, 0.8), 0.7); };
}

/* incline helper: pivot P0, slope length L, angle th (deg, rising to the right) */
function incline(g, { L = 1150, fillOp = 1 } = {}) {
  const body = poly(g, { fill: "url(#hatch)", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round" });
  const base = arc(g, INK, 3.5), thL = tex(g, "\\theta", { size: 44 });
  return (P0, th, op = 1) => {
    const u = [Math.cos(th * D2R), -Math.sin(th * D2R)], n = [-Math.sin(th * D2R), -Math.cos(th * D2R)];
    const top = add(P0, u, L), foot = [P0[0] + L * Math.cos(th * D2R), P0[1]];
    body.draw([P0, top, foot], op);
    base.draw(P0[0], P0[1], 110, -th, 0, op * (th > 2 ? 1 : 0));
    thL.at(P0[0] + 150 * Math.cos(th / 2 * D2R), P0[1] - 150 * Math.sin(th / 2 * D2R), op * (th > 4 ? 1 : 0));
    return { u, n };
  };
}

/* ========================================================== s01 — the question */
section("s01", (g, c) => {
  const title = hand(g, "Contact forces, derived", { size: 170, anchor: "middle", weight: 700 });
  const sub = hand(g, "IB Physics SL · A.2 Forces", { size: 64, anchor: "middle", color: MUTED });
  const inc = incline(g, { L: 700 });
  const blk = block(g, 150, 96);
  const W = arrow(g, COL.W, 7), cA = arrow(g, COL.W, 5), cB = arrow(g, COL.W, 5);
  const mgL = tex(g, "mg", { size: 46, color: COL.W }), qA = tex(g, "mg\\sin\\theta\\;?", { size: 50, color: COL.W }), qB = tex(g, "mg\\cos\\theta\\;?", { size: 50, color: COL.W });
  const icons = ["normal force", "friction", "tension", "buoyancy", "viscous drag"].map((name, i) => {
    const ig = el("g", {}, g); const x = -760 + i * 300, y = 400;
    const lab = hand(ig, name, { size: 46, anchor: "middle" });
    return { name, ig, x, y, lab, a: arrow(ig, [COL.N, COL.FR, COL.T, COL.B, COL.D][i], 6), b: block(ig, 90, 64), l: pen(ig, INK, 4), w: el("rect", { x: x - 90, y: y - 130, width: 180, height: 150, fill: "#cfe4f5", opacity: 0 }, ig),
      ball: el("circle", { r: 34, fill: "#fbf7ef", stroke: INK, "stroke-width": 4, opacity: 0 }, ig) };
  });
  const nos = ["springs", "circles", "kinematics"].map((n, i) => ({ h: hand(g, `no ${n}`, { size: 58, color: INK }), s: pen(g, COL.FR, 6) }));
  return t => {
    title.write(0, -320, t, 0.4, { speed: 0.04 }); sub.write(0, -235, t, 1.6, { speed: 0.03, op: 1 });
    const P0 = [-560, 130], th = 30, { u, n } = inc(P0, th, ap(t, 2.0, 0.8));
    const C = add(add(P0, u, 380), n, 48);
    blk.at(C[0], C[1], -th, ap(t, 2.3, 0.6));
    const wp = ap(t, c("draw the forces"), 0.7);
    W.draw(C[0], C[1], C[0], C[1] + 240, { p: wp }); mgL.at(C[0] + 52, C[1] + 230, wp);
    const q = ap(t, c("where does mg sin θ"), 0.7), Lw = 240;
    const nIn = [-n[0], -n[1]], uDn = [-u[0], -u[1]];
    cA.draw(C[0], C[1], ...add(C, uDn, Lw * Math.sin(th * D2R)), { p: q, dash: "14 10" });
    cB.draw(C[0], C[1], ...add(C, nIn, Lw * Math.cos(th * D2R)), { p: q, dash: "14 10" });
    qA.at(...add(add(C, uDn, Lw * 0.5 + 40), [0, -40]), q * (1 - 0.6 * ap(t, c("In the next few"))), { anchor: "r" });
    qB.at(...add(add(C, nIn, Lw * 0.87), [190, -10]), q * (1 - 0.6 * ap(t, c("In the next few"))));
    const words = ["the normal force", "friction", "tension", "buoyancy", "viscous drag"];
    icons.forEach((ic, i) => {
      const k = ap(t, c(words[i]), 0.5), { x, y } = ic;
      ic.lab.write(x, y + 80, t, c(words[i]), { op: k });
      ic.l.draw(x - 90, y, x + 90, y, k, i === 3 || i === 4 ? 0 : 1);
      if (i === 0) { ic.b.at(x, y - 32, 0, k); ic.a.draw(x, y - 32, x, y - 170, { p: k }); }
      if (i === 1) { ic.b.at(x, y - 32, 0, k); ic.a.draw(x, y - 4, x - 120, y - 4, { p: k }); }
      if (i === 2) { ic.l.draw(x - 60, y - 210, x + 60, y - 210, k); ic.b.at(x, y - 60, 0, k); ic.a.draw(x, y - 92, x, y - 200, { p: k }); }
      if (i === 3) { set(ic.w, { opacity: 0.8 * k }); ic.b.at(x, y - 50, 0, k); ic.a.draw(x, y - 50, x, y - 170, { p: k }); }
      if (i === 4) { ic.b.at(x, y, 0, 0); set(ic.ball, { cx: x, cy: y - 40, opacity: k }); ic.a.draw(x, y - 74, x, y - 180, { p: k }); }
    });
    ["springs", "circles", "kinematics"].forEach((w, i) => {
      const t0 = c(i === 0 ? "No springs" : i === 1 ? "no circles" : "no kinematics"), y = -100 + i * 95;
      nos[i].h.write(480, y, t, t0, { speed: 0.02 });
      nos[i].s.draw(470, y - 16, 470 + 40 + w.length * 26 + 60, y - 22, ap(t, t0 + 0.4, 0.35), ap(t, t0));
    });
  };
});

/* ========================================================== s02 — resolving a force */
section("s02", (g, c, id) => {
  const H = heading(g, "①", "the one tool: resolving a force", S(id));
  const O = [-720, 300], L = 640;
  const swing0 = c("Swing the angle"), swing1 = c("The rule to remember");
  const th = t => 35 + 24 * Math.sin((t - swing0) * 2 * Math.PI / 4.2) * win(t, swing0 + 0.3, swing1 - 0.2, 0.8, 0.8);
  const F = arrow(g, COL.F, 8), Fx = arrow(g, COL.F, 5), Fy = arrow(g, COL.F, 5);
  const rm = rightMark(g), an = arc(g), thL = tex(g, "\\theta", { size: 46 }), FL = tex(g, "F", { size: 52, color: COL.F });
  const hyp = hand(g, "hypotenuse", { size: 50, color: MUTED }), adj = hand(g, "adjacent (touching θ)", { size: 50, color: MUTED }), opp = hand(g, "opposite", { size: 50, color: MUTED, anchor: "start" });
  const FxL = tex(g, "F\\cos\\theta", { size: 50, color: COL.F }), FyL = tex(g, "F\\sin\\theta", { size: 50, color: COL.F });
  const read = hand(g, "", { size: 50, color: COL.F });
  const E1 = eqs(g, 160, -300, [
    { tex: "\\cos\\theta = \\dfrac{\\text{adjacent}}{\\text{hypotenuse}}", t: c("Cosine is adjacent") },
    { tex: "\\Rightarrow\\ \\text{adjacent} = F\\cos\\theta", t: c("the side touching the angle is"), final: true, ulw: 500, ulColor: COL.F },
    { tex: "\\sin\\theta = \\dfrac{\\text{opposite}}{\\text{hypotenuse}}", t: c("Sine is opposite"), y: -40 },
    { tex: "\\Rightarrow\\ \\text{opposite} = F\\sin\\theta", t: c("the side across from the angle is"), y: 70, final: true, ulw: 500, ulColor: COL.F },
    { tex: "(F\\cos\\theta)^2 + (F\\sin\\theta)^2 = F^2", t: c("together they always rebuild F"), y: 200, size: 42 },
  ], { gap: 110 });

function cameraAt(t) {
  let i = 0; while (i < CAM.length - 2 && CAM[i + 1].t <= t) i++;
  const a = CAM[i], b = CAM[i + 1], k = ease(clamp((t - a.t) / Math.max(1e-3, b.t - a.t)));

}

  const stage = document.getElementById("stage"), controls = document.getElementById("controls");
  controls.style.display = "flex";
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); stage.style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), btn = document.getElementById("play");
  scrub.max = TOTAL;
  const audios = CFG.scenes.map(s => { const a = new Audio(`/audio/${s.id}.wav`); a.preload = "auto"; return a; });
  let playing = false, t0 = 0, wall0 = 0, cur = 0, curScene = -1;
  const sceneIndex = t => CFG.scenes.findIndex(s => t >= S(s.id) && t < E(s.id));
  const syncAudio = t => { const i = sceneIndex(t); if (i !== curScene) { audios.forEach(a => a.pause()); curScene = i; if (playing && i >= 0) { audios[i].currentTime = t - S(CFG.scenes[i].id); audios[i].play().catch(() => {}); } } };
  const show = t => { cur = t; renderAt(t); scrub.value = t; clock.textContent = `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`; };
  scrub.addEventListener("input", () => { playing = false; btn.textContent = "Play"; audios.forEach(a => a.pause()); curScene = -1; show(parseFloat(scrub.value)); });
  btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; t0 = cur; wall0 = performance.now(); curScene = -1; if (!playing) audios.forEach(a => a.pause()); });
  const loop = () => { if (playing) { const t = t0 + (performance.now() - wall0) / 1000; if (t >= TOTAL) { playing = false; btn.textContent = "Play"; } show(Math.min(t, TOTAL)); syncAudio(t); } requestAnimationFrame(loop); };
  show(params.has("t") ? parseFloat(params.get("t")) : 0); loop();
}
</script>
