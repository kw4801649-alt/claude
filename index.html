<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>River Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>River Simulator</h1>
      <p class="subtitle">A living river: meandering current, rocks that deflect the flow, and rain that stirs it up.</p>
    </header>

    <main class="stage">
      <canvas id="river" width="1000" height="640"></canvas>

      <aside class="panel">
        <div class="control">
          <label for="flow">Flow speed</label>
          <input type="range" id="flow" min="10" max="200" value="80" />
          <span class="value" id="flow-val">80</span>
        </div>

        <div class="control">
          <label for="count">Water particles</label>
          <input type="range" id="count" min="200" max="4000" step="50" value="1600" />
          <span class="value" id="count-val">1600</span>
        </div>

        <div class="control">
          <label for="turbulence">Turbulence</label>
          <input type="range" id="turbulence" min="0" max="100" value="20" />
          <span class="value" id="turbulence-val">20</span>
        </div>

        <div class="control checkbox-row">
          <label for="rain">Rain</label>
          <input type="checkbox" id="rain" />
        </div>

        <div class="control checkbox-row">
          <label for="flowfield">Show flow field</label>
          <input type="checkbox" id="flowfield" />
        </div>

        <div class="buttons">
          <button id="clear-rocks">Clear rocks</button>
          <button id="reset">Reset river</button>
        </div>

        <div class="hint">
          <p><strong>Click</strong> the river to drop a rock.</p>
          <p><strong>Right-click</strong> a rock to remove it.</p>
        </div>

        <div class="stats">
          <div><span class="label">FPS</span><span id="stat-fps">--</span></div>
          <div><span class="label">Particles</span><span id="stat-particles">--</span></div>
          <div><span class="label">Rocks</span><span id="stat-rocks">--</span></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="river-sim.js"></script>
</body>
</html>
